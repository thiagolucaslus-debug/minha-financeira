name: Anti-Sono 24-7 & Cofre Criptografado (Minha Financeira)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Mantem a instancia Minha Financeira acordada 24/7 (ping a cada 10 min)
    # Repositorio PUBLICO = minutos ilimitados gratuitos (0 min da cota privada)
    # 2a conta Render Free = 750h/mes exclusivas (1 mes de 31 dias = 744h -> R$ 0,00)
    - cron: "*/10 * * * *"

concurrency:
  group: minha-financeira-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping 24/7 e Auto-Hidratacao do Cofre AES-256-GCM
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          EXPECTED_GIT_SHA: ${{ github.sha }}
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
          CLOUD_VAULT_HYDRATE_SECRET: ${{ secrets.CLOUD_VAULT_HYDRATE_SECRET }}
          CLOUD_VAULT_GITHUB_TOKEN: ${{ secrets.CLOUD_VAULT_GITHUB_TOKEN }}
          CLOUD_VAULT_REPO: ${{ secrets.CLOUD_VAULT_REPO }}
          CLOUD_VAULT_AES_KEY: ${{ secrets.CLOUD_VAULT_AES_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          base_url = (os.environ.get("RENDER_APP_URL") or "").strip().rstrip("/")
          if not base_url:
              print("[INFO] Variavel RENDER_APP_URL ainda nao configurada em Settings -> Variables.")
              print("[INFO] Assim que criar o Web Service na 2a conta do Render, adicione RENDER_APP_URL para ativar o ping 24/7.")
              sys.exit(0)

          health_url = f"{base_url}/health"
          event_name = (os.environ.get("GITHUB_EVENT_NAME") or "").strip()

          vault_secret = (os.environ.get("CLOUD_VAULT_HYDRATE_SECRET") or "").strip()
          vault_gh_token = (os.environ.get("CLOUD_VAULT_GITHUB_TOKEN") or "").strip()
          vault_repo = (os.environ.get("CLOUD_VAULT_REPO") or "").strip()
          vault_aes = (os.environ.get("CLOUD_VAULT_AES_KEY") or "").strip()
          has_vault_secrets = bool(vault_secret and vault_gh_token and vault_repo and vault_aes)

          def fetch_health():
              req = urllib.request.Request(
                  health_url,
                  headers={"User-Agent": "MinhaFinanceira-KeepAlive/1.0"},
              )
              with urllib.request.urlopen(req, timeout=35) as resp:
                  raw = resp.read().decode("utf-8", errors="replace")
                  return resp.status, json.loads(raw)

          def hydrate_vault():
              hyd_req = urllib.request.Request(
                  f"{base_url}/cloud/vault/hydrate",
                  data=json.dumps({
                      "hydrate_secret": vault_secret,
                      "github_token": vault_gh_token,
                      "repo": vault_repo,
                      "aes_key": vault_aes,
                      "branch": "main",
                  }).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(hyd_req, timeout=60) as hr:
                  res_json = json.loads(hr.read().decode("utf-8"))
                  print(
                      f"[OK] Cofre criptografado 24/7 hidratado! "
                      f"vault_connected={res_json.get('vault_connected')}, rev={res_json.get('revision')}"
                  )
                  return res_json

          expected_sha = (os.environ.get("EXPECTED_GIT_SHA") or "").strip()[:12]
          if event_name == "push":
              print(f"[INFO] Push detectado (alvo {expected_sha}): acompanhando deploy no Render...")
              time.sleep(20)

          max_cycles = 24 if event_name == "push" else 4
          health_data = None
          last_err = None

          for cycle in range(1, max_cycles + 1):
              try:
                  t0 = time.monotonic()
                  code, data = fetch_health()
                  elapsed_ms = int((time.monotonic() - t0) * 1000)
                  nuvem = data.get("nuvem") or {}
                  live_sha = str(data.get("git_sha") or "").strip()[:12]
                  print(
                      f"[OK] Ciclo {cycle}/{max_cycles}: HTTP {code} em {elapsed_ms} ms -> "
                      f"sha={live_sha or 'n/a'}, provedor={nuvem.get('provedor')}, "
                      f"vault={nuvem.get('vault_conectado')}, rev={nuvem.get('revisao')}"
                  )
                  health_data = data

                  if has_vault_secrets and not nuvem.get("vault_conectado"):
                      hydrate_vault()
                      _, health_data = fetch_health()
                      nuvem = health_data.get("nuvem") or {}
                      live_sha = str(health_data.get("git_sha") or "").strip()[:12]

                  if event_name != "push":
                      break

                  sha_ready = (not expected_sha) or (live_sha == expected_sha)
                  vault_ready = (not has_vault_secrets) or bool(nuvem.get("vault_conectado"))
                  if sha_ready and vault_ready and (live_sha == expected_sha or cycle >= 14):
                      break
                  time.sleep(15)
              except Exception as exc:
                  last_err = exc
                  print(f"[AVISO] Ciclo {cycle}/{max_cycles} falhou ({exc}). Aguardando 15s...")
                  if cycle < max_cycles:
                      time.sleep(15)

          if health_data is None:
              print(f"[ERRO] Servidor nao respondeu: {last_err}")
              sys.exit(1)
          PY
